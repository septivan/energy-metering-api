# fly.toml app configuration file
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'energy-metering-api'
primary_region = 'sin'  # Singapore region, change if needed

[build]

[deploy]
  strategy = 'rolling'

[env]
  SERVICE_NAME = 'energy-metering-api'
  SERVICE_PORT = '8080'
  API_BASE_PATH = '/api/v1'
  WS_PATH = '/ws/live'
  SHUTDOWN_TIMEOUT = '15'
  DEFAULT_LIMIT = '50'
  DEFAULT_TIME_RANGE_HOURS = '24'
  RABBITMQ_EXCHANGE = 'energy-metering.worker.events.exchange'
  RABBITMQ_QUEUE = 'energy-metering.worker.events.queue'
  RABBITMQ_ROUTING_KEY = 'meter.reading.accepted'
  RABBITMQ_RETRY_INTERVAL = '5'
  PDF_OUTPUT_DIR = '/tmp'
  WS_BUFFER_SIZE = '256'
  WS_CLIENT_BUFFER_SIZE = '256'
  READ_ONLY_DB = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 750

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 750

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
